name: Strict Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'oracle'
        cache: maven

    # 1. Kiểm tra lỗi biên dịch (Compile)
    - name: Compile Code
      run: mvn clean compile

    # 2. Kiểm tra lỗi phong cách (Checkstyle)
    - name: Run Style Check
      run: mvn checkstyle:check

    # 3. Chạy tất cả Unit Tests (Lỗi logic)
    - name: Run Unit Tests
      run: mvn test

    # 4. Kiểm tra lỗi tiềm ẩn bằng SpotBugs (Tùy chọn thêm)
    # Giúp tìm lỗi như NullPointerException, lỗi đóng resource Database...
    - name: SpotBugs Analysis
      run: mvn spotbugs:check || echo "SpotBugs found issues"
