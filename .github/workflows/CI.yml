name: Auction-App CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java-version: ['25']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Build, Test, and Package Fat JARs (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run mvn clean package -DskipITs

    - name: Build, Test, and Package Fat JARs (Windows/macOS)
      if: runner.os != 'Linux'
      run: mvn clean package -DskipITs

    - name: SpotBugs analysis
      run: mvn spotbugs:check || true
      continue-on-error: true

    - name: Publish test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: |
          **/target/surefire-reports/
          **/target/failsafe-reports/

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: auction-app-jars-${{ matrix.os }}
        path: |
          Server/target/server-1.0-SNAPSHOT-fat.jar
          Client/target/client-1.0-SNAPSHOT-fat.jar
          Commons/target/commons-1.0-SNAPSHOT.jar

  code-coverage:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Generate JaCoCo coverage report (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run mvn clean test jacoco:report

    - name: Generate JaCoCo coverage report (Windows/macOS)
      if: runner.os != 'Linux'
      run: mvn clean test jacoco:report

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: "**/target/site/jacoco/jacoco.xml"
        fail_ci_if_error: false
        verbose: true

  security-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Check for vulnerable dependencies
      run: mvn dependency-check:check || true
      continue-on-error: true

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Run integration tests (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run mvn verify

    - name: Run integration tests (Windows/macOS)
      if: runner.os != 'Linux'
      run: mvn verify
      
    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: |
          **/target/failsafe-reports/
          **/target/surefire-reports/